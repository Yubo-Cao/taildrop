name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The WinUI 3 interface is a NativeAOT .NET app.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        # With signing set up, the package manifest's Publisher must match the
        # certificate subject: set the MSIX_PUBLISHER repository variable.
        run: |
          $publisher = '${{ vars.MSIX_PUBLISHER }}'
          if ($publisher) { ./build.ps1 -Publisher $publisher } else { ./build.ps1 }

      - name: Collect app files
        shell: pwsh
        run: |
          $v = (Get-Item build/TailDrop.exe).VersionInfo.ProductVersion
          New-Item -ItemType Directory -Force dist/app | Out-Null
          Copy-Item build/TailDrop.exe, build/TailDropShell.dll, build/TailDrop.msix dist/app
          Copy-Item build/ui dist/app/ui -Recurse
          "TD_VERSION=$v" >> $env:GITHUB_ENV

      - name: Upload unsigned app files
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: TailDrop-${{ env.TD_VERSION }}-unsigned
          path: dist/app

      # Code signing through SignPath Foundation (see "Code signing policy" in
      # README.md). Runs once the SIGNPATH_ORGANIZATION_ID variable and the
      # SIGNPATH_API_TOKEN secret exist.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: taildrop
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/app

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp /DSourceDir=..\dist\app installer\TailDrop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Zip
        shell: pwsh
        run: |
          $zip = "dist/zip/TailDrop-$env:TD_VERSION-x64"
          New-Item -ItemType Directory -Force $zip | Out-Null
          Copy-Item dist/app/*, install.ps1, uninstall.ps1, menu.ps1, README.md, LICENSE $zip -Recurse
          Copy-Item package "$zip/package" -Recurse
          Compress-Archive -Path "$zip/*" -DestinationPath "dist/TailDrop-$env:TD_VERSION-x64.zip"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: TailDrop-${{ env.TD_VERSION }}
          path: |
            dist/TailDrop-*-Setup.exe
            dist/TailDrop-*-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content -Raw installer/release-notes.md
          gh release create "${{ github.ref_name }}" dist/TailDrop-$env:TD_VERSION-Setup.exe dist/TailDrop-$env:TD_VERSION-x64.zip `
            --title "TailDrop ${{ github.ref_name }}" --notes $notes
