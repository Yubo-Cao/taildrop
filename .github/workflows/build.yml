name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        # When signing is set up, the package manifest's Publisher must match
        # the certificate subject, e.g. vars.MSIX_PUBLISHER.
        run: |
          $publisher = '${{ vars.MSIX_PUBLISHER }}'
          if ($publisher) { ./build.ps1 -Publisher $publisher } else { ./build.ps1 }

      - name: Collect release files
        shell: pwsh
        run: |
          $v = (Get-Item build/TailDrop.exe).VersionInfo.ProductVersion
          $out = "dist/TailDrop-$v-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/TailDrop.exe, build/TailDropShell.dll, build/TailDrop.msix, install.ps1, uninstall.ps1, README.md, LICENSE $out
          Copy-Item package "$out/package" -Recurse
          "TD_VERSION=$v" >> $env:GITHUB_ENV

      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: TailDrop-${{ env.TD_VERSION }}-x64
          path: dist/TailDrop-${{ env.TD_VERSION }}-x64

      # Code signing through SignPath Foundation (see "Code signing policy" in
      # README.md). Active once the project's SignPath settings exist.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: taildrop
          signing-policy-slug: release-signing
          artifact-configuration-slug: release-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = if (Test-Path dist/signed) { 'dist/signed' } else { "dist/TailDrop-$env:TD_VERSION-x64" }
          Compress-Archive -Path "$src/*" -DestinationPath "dist/TailDrop-$env:TD_VERSION-x64.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          TailDrop $env:TD_VERSION for Windows 10 and 11 (x64).

          Download the zip, extract it, then run ``install.ps1`` in PowerShell. See the README for details.

          Code signing policy: https://github.com/${{ github.repository }}#code-signing-policy
          "@
          gh release create "${{ github.ref_name }}" "dist/TailDrop-$env:TD_VERSION-x64.zip" --title "TailDrop ${{ github.ref_name }}" --notes $notes
